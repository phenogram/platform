nameOverride: ""
fullnameOverride: ""

replicaCount: 1
deploymentRevision: "local"
secretRevision: "local"

image:
  repository: ghcr.io/phenogram/platform
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

config:
  appEnv: production
  listenAddr: 0.0.0.0:8080
  landingBaseUrl: https://phenogram.io
  appBaseUrl: https://app.phenogram.io
  apiBaseUrl: https://api.phenogram.io
  telegramCloudApiUrl: https://api.telegram.org
  rustLog: phenogram_platform=info,tower_http=info
  sessionTtlHours: 720
  retentionSweepSeconds: 3600

secrets:
  # This Secret is intentionally not created by the chart. The deployment
  # operator provisions it without putting secret values in Helm release history.
  existingSecret: phenogram-secrets
  databaseUrlKey: DATABASE_URL
  postgresPasswordKey: POSTGRES_PASSWORD
  masterKeyKey: MASTER_KEY
  publicIdKeyKey: PUBLIC_ID_KEY
  linkSigningKeyKey: LINK_SIGNING_KEY
  googleOauthClientIdKey: GOOGLE_OAUTH_CLIENT_ID
  googleOauthClientSecretKey: GOOGLE_OAUTH_CLIENT_SECRET
  githubOauthClientIdKey: GITHUB_OAUTH_CLIENT_ID
  githubOauthClientSecretKey: GITHUB_OAUTH_CLIENT_SECRET
  telegramApiIdKey: TELEGRAM_API_ID
  telegramApiHashKey: TELEGRAM_API_HASH
  dataPlaneSyncTokenKey: DATA_PLANE_SYNC_TOKEN

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    cert-manager.io/issuer-kind: ClusterIssuer
  landing:
    host: phenogram.io
    tls:
      enabled: true
      secretName: phenogram-io-tls
  app:
    host: app.phenogram.io
    annotations:
      # The authenticated update log uses a long-lived same-origin SSE
      # connection. Keep events flowing immediately through ingress-nginx.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: app-phenogram-io-tls
  api:
    host: api.phenogram.io
    annotations:
      # Raw Telegram bot tokens are part of /bot<TOKEN> and /file/bot<TOKEN>
      # request paths. They must never enter ingress access or error logs.
      nginx.ingress.kubernetes.io/enable-access-log: "false"
      # This cluster explicitly permits Critical-risk server snippets. Keep the
      # API host's nginx error log on /dev/null; token-free gateway telemetry
      # remains available for operational diagnostics.
      nginx.ingress.kubernetes.io/server-snippet: |
        error_log /dev/null crit;
        merge_slashes off;
        large_client_header_buffers 4 256k;
        client_header_timeout 500s;
        client_body_timeout 500s;
      # Do not add an aggregate ingress limit. The official server enforces
      # Telegram's per-file limits itself, including multipart requests with
      # more than one file. Streaming keeps those bodies out of nginx buffers.
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: api-phenogram-io-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup:
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    periodSeconds: 5
    timeoutSeconds: 3
  liveness:
    failureThreshold: 3
    periodSeconds: 15
    timeoutSeconds: 3

terminationGracePeriodSeconds: 60

pdb:
  enabled: true
  # This single-replica MVP cannot guarantee availability during a node drain.
  # maxUnavailable=1 avoids creating an undrainable cluster.
  maxUnavailable: 1

networkPolicy:
  enabled: true
  ingressController:
    namespace: ingress-nginx
    podLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/name: ingress-nginx

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17-bookworm
    digest: ""
    pullPolicy: IfNotPresent
  database: phenogram
  username: phenogram
  port: 5432
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  pdb:
    enabled: true
    maxUnavailable: 1
  backup:
    enabled: true
    schedule: "17 */6 * * *"
    timeZone: Asia/Yekaterinburg
    existingSecret: phenogram-backup-secrets
    stagingSize: 8Gi
    retention:
      daily: 14
      weekly: 8
      monthly: 12
    restic:
      repository: restic/restic
      tag: 0.18.0
      pullPolicy: IfNotPresent
      checkReadDataSubset: 5%
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 1Gi

telegramBotApi:
  enabled: true
  image:
    repository: ghcr.io/phenogram/telegram-bot-api
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 8081
  dataDir: /var/lib/telegram-bot-api
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    retain: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# The replacement Telegram data plane is deliberately staged behind two
# switches. `enabled` creates private shadow resources. `publicCutover` moves
# only /bot* and /file* at api.phenogram.io after bot-by-bot migration.
dataPlane:
  enabled: false
  publicCutover: false
  gateway:
    image:
      repository: ghcr.io/phenogram/data-plane-gateway
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    publicPort: 8080
    adminPort: 9090
    terminationGracePeriodSeconds: 120
    routeSnapshot:
      url: http://phenogram/api/internal/data-plane/routes
      path: /var/lib/phenogram-gateway/routes.json
      refreshSeconds: 5
    telemetry:
      url: http://phenogram/api/internal/data-plane/telemetry
      queueCapacity: 4096
    persistence:
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 256Mi
      retain: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
    probes:
      startup:
        failureThreshold: 60
        periodSeconds: 2
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        periodSeconds: 5
        timeoutSeconds: 2
      liveness:
        failureThreshold: 3
        periodSeconds: 15
        timeoutSeconds: 2
  official:
    port: 8081
    dataDir: /var/lib/telegram-bot-api
    stats:
      # The official statistics endpoint contains process-wide details and is
      # reachable only by sidecars in the same pod network namespace.
      listenAddress: 127.0.0.1
      port: 8083
      pollIntervalSeconds: "15"
    image:
      repository: ghcr.io/phenogram/telegram-bot-api
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    terminationGracePeriodSeconds: 120
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    fileServer:
      port: 8082
      image:
        # This is the same binary as the gateway, but its digest is advanced
        # independently so a gateway-only rollout cannot restart Telegram.
        repository: ghcr.io/phenogram/data-plane-gateway
        tag: ""
        digest: ""
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
    collector:
      enabled: true
      controlPort: 8084
      # Pin this independently in production. A normal control-plane release
      # must not restart the native Bot API pods merely because the app image
      # changed.
      image:
        repository: ghcr.io/phenogram/platform
        tag: ""
        digest: ""
        pullPolicy: IfNotPresent
      command: /usr/local/bin/phenogram-tap-collector
      socketDirectory: /run/phenogram-tap
      socketPath: /run/phenogram-tap/tap.sock
      ackSocketPath: /run/phenogram-tap/ack.sock
      maxEventBytes: "262144"
      maxInflightEvents: "256"
      maxInflightBytes: "33554432"
      reassemblyTimeoutMs: "5000"
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 250m
          memory: 256Mi
    pools:
      - name: standard
        localMode: false
        persistence:
          storageClass: ""
          accessModes:
            - ReadWriteOnce
          size: 20Gi
          retain: true
      - name: local
        localMode: true
        persistence:
          storageClass: ""
          accessModes:
            - ReadWriteOnce
          size: 100Gi
          retain: true
