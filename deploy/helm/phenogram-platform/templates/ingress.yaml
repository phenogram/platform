{{- if .Values.ingress.enabled }}
{{- $fullname := include "phenogram.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Keep the live apex ingress identity so ingress-shim updates the existing
  # phenogram-io-tls Certificate owner instead of racing a second owner.
  name: {{ $fullname }}-web
  labels:
    {{- include "phenogram.labels" . | nindent 4 }}
    app.kubernetes.io/component: landing-ingress
  {{- with omit .Values.ingress.annotations "traefik.ingress.kubernetes.io/router.pathmatcher" }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.landing.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.landing.host | quote }}
      secretName: {{ .Values.ingress.landing.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.landing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-app
  labels:
    {{- include "phenogram.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-ingress
  {{- with omit .Values.ingress.annotations "traefik.ingress.kubernetes.io/router.pathmatcher" }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.app.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.app.host | quote }}
      secretName: {{ .Values.ingress.app.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.app.host | quote }}
      http:
        paths:
          # The authenticated console uses same-origin management /api calls.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Keep this identity stable: cert-manager's api-phenogram-io-tls Certificate
  # is controller-owned by this Ingress in the live namespace.
  name: {{ $fullname }}-api
  labels:
    {{- include "phenogram.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.api.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host | quote }}
      secretName: {{ .Values.ingress.api.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.api.host | quote }}
      http:
        paths:
          # Traefik's explicit PathPrefix matcher is required for the Telegram
          # shape /bot<TOKEN>/..., which is not a Kubernetes path-segment prefix.
          {{- range list "/bot" "/file" "/telegram" "/events" "/public" }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
          {{- end }}
{{- end }}
