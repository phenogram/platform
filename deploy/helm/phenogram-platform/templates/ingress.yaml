{{- if .Values.ingress.enabled }}
{{- $fullname := include "phenogram.fullname" . -}}
{{- $appAnnotations := mergeOverwrite (dict) .Values.ingress.annotations .Values.ingress.app.annotations -}}
{{- $apiAnnotations := mergeOverwrite (dict) .Values.ingress.annotations .Values.ingress.api.annotations -}}
{{- if and .Values.dataPlane.enabled .Values.dataPlane.publicCutover -}}
{{- $_ := set $apiAnnotations "nginx.ingress.kubernetes.io/use-regex" "true" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Keep the live apex ingress identity so ingress-shim updates the existing
  # phenogram-io-tls Certificate owner instead of racing a second owner.
  name: {{ $fullname }}-web
  labels:
    {{- include "phenogram.labels" . | nindent 4 }}
    app.kubernetes.io/component: landing-ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.landing.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.landing.host | quote }}
      secretName: {{ .Values.ingress.landing.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.landing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
          - path: /privacy
            pathType: Exact
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-app
  labels:
    {{- include "phenogram.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-ingress
  {{- with $appAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.app.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.app.host | quote }}
      secretName: {{ .Values.ingress.app.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.app.host | quote }}
      http:
        paths:
          # The authenticated console uses same-origin management /api calls.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Keep this identity stable: cert-manager's api-phenogram-io-tls Certificate
  # is controller-owned by this Ingress in the live namespace.
  name: {{ $fullname }}-api
  labels:
    {{- include "phenogram.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-ingress
  {{- with $apiAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.api.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host | quote }}
      secretName: {{ .Values.ingress.api.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.api.host | quote }}
      http:
        paths:
          {{- if and .Values.dataPlane.enabled .Values.dataPlane.publicCutover }}
          # Only the native Telegram API shapes move to the database-independent
          # gateway. /telegram, /events, and /public remain on the control app.
          # Regex locations are required because Telegram's native API uses the
          # segment-less /bot<TOKEN> form rather than /bot/<TOKEN>.
          - path: /bot.*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullname }}-data-plane-gateway
                port:
                  name: public-http
          - path: /file/bot.*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullname }}-data-plane-gateway
                port:
                  name: public-http
          {{- end }}
          # Route the machine origin into the application and let its strict
          # host-aware router reject every non-machine path. A root Prefix is
          # portable across ingress controllers and includes Telegram's
          # segment-less /bot<TOKEN>/... compatibility shape.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
{{- end }}
