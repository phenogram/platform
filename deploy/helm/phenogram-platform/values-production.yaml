fullnameOverride: phenogram

replicaCount: 1

imagePullSecrets:
  - name: phenogram-ghcr

image:
  repository: ghcr.io/phenogram/platform
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

config:
  appEnv: production
  landingBaseUrl: https://phenogram.io
  appBaseUrl: https://app.phenogram.io
  apiBaseUrl: https://api.phenogram.io

secrets:
  existingSecret: phenogram-secrets

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    cert-manager.io/issuer-kind: ClusterIssuer
  landing:
    host: phenogram.io
    tls:
      enabled: true
      secretName: phenogram-io-tls
  app:
    host: app.phenogram.io
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: app-phenogram-io-tls
  api:
    host: api.phenogram.io
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "2000m"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: api-phenogram-io-tls

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17-bookworm
  persistence:
    storageClass: standard
    size: 10Gi
  backup:
    enabled: true
    existingSecret: phenogram-backup-secrets

telegramBotApi:
  enabled: true
  image:
    repository: ghcr.io/phenogram/telegram-bot-api
    tag: ""
    digest: ""
  persistence:
    storageClass: standard
    size: 20Gi

networkPolicy:
  ingressController:
    namespace: ingress-nginx
    podLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/name: ingress-nginx
