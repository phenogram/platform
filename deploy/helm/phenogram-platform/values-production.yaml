fullnameOverride: phenogram

replicaCount: 1

imagePullSecrets:
  - name: phenogram-ghcr

image:
  repository: ghcr.io/phenogram/platform
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

config:
  appEnv: production
  landingBaseUrl: https://phenogram.io
  appBaseUrl: https://app.phenogram.io
  apiBaseUrl: https://api.phenogram.io

secrets:
  existingSecret: phenogram-secrets

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    cert-manager.io/issuer-kind: ClusterIssuer
  landing:
    host: phenogram.io
    tls:
      enabled: true
      secretName: phenogram-io-tls
  app:
    host: app.phenogram.io
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: app-phenogram-io-tls
  api:
    host: api.phenogram.io
    annotations:
      nginx.ingress.kubernetes.io/enable-access-log: "false"
      nginx.ingress.kubernetes.io/server-snippet: |
        error_log /dev/null crit;
        merge_slashes off;
        large_client_header_buffers 4 256k;
        client_header_timeout 500s;
        client_body_timeout 500s;
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: api-phenogram-io-tls

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17-bookworm
  persistence:
    storageClass: standard
    size: 10Gi
  backup:
    enabled: true
    existingSecret: phenogram-backup-secrets

telegramBotApi:
  enabled: false
  image:
    repository: ghcr.io/phenogram/telegram-bot-api
    tag: ""
    digest: ""
  persistence:
    storageClass: standard
    size: 20Gi

dataPlane:
  # The pinned official pools and gateway passed their Contabo shadow checks.
  enabled: true
  publicCutover: true
  gateway:
    image:
      repository: ghcr.io/phenogram/data-plane-gateway
      digest: sha256:a9ed255478fa5aa38c05e24ce83c44739873be0d667c877fc619f5962f001823
    persistence:
      storageClass: standard
  official:
    image:
      repository: ghcr.io/phenogram/telegram-bot-api
      digest: sha256:f8ec61f69fbfc8eb8d2bd302deaa07245068e3713e0977ca605c9b77348246de
    collector:
      image:
        repository: ghcr.io/phenogram/platform
        digest: sha256:a3fd7e6802c4dcac49a9fdbcb6d18ac1c19bd2e33cb1fb6a1b1fe71cd846e42f
    fileServer:
      image:
        repository: ghcr.io/phenogram/data-plane-gateway
        digest: sha256:a6e335140960184466f8fcb47f503504e21a4220dc2c0473b4151569d84f751d
    pools:
      - name: standard
        localMode: false
        persistence:
          storageClass: standard
          accessModes:
            - ReadWriteOnce
          size: 20Gi
          retain: true
      - name: local
        localMode: true
        persistence:
          storageClass: standard
          accessModes:
            - ReadWriteOnce
          size: 100Gi
          retain: true

networkPolicy:
  ingressController:
    namespace: ingress-nginx
    podLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/name: ingress-nginx
