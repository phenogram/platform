fullnameOverride: phenogram

replicaCount: 1

imagePullSecrets:
  - name: phenogram-ghcr

image:
  repository: ghcr.io/phenogram/platform
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

config:
  appEnv: production
  landingBaseUrl: https://phenogram.io
  appBaseUrl: https://app.phenogram.io
  apiBaseUrl: https://api.phenogram.io

secrets:
  existingSecret: phenogram-secrets

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    cert-manager.io/issuer-kind: ClusterIssuer
  landing:
    host: phenogram.io
    tls:
      enabled: true
      secretName: phenogram-io-tls
  app:
    host: app.phenogram.io
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: app-phenogram-io-tls
  api:
    host: api.phenogram.io
    annotations:
      nginx.ingress.kubernetes.io/enable-access-log: "false"
      nginx.ingress.kubernetes.io/server-snippet: |
        error_log /dev/null crit;
        merge_slashes off;
        large_client_header_buffers 4 256k;
        client_header_timeout 500s;
        client_body_timeout 500s;
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: api-phenogram-io-tls

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17-bookworm
  persistence:
    storageClass: standard
    size: 10Gi
  backup:
    enabled: true
    existingSecret: phenogram-backup-secrets

telegramBotApi:
  enabled: true
  image:
    repository: ghcr.io/phenogram/telegram-bot-api
    tag: ""
    digest: ""
  persistence:
    storageClass: standard
    size: 20Gi

dataPlane:
  # Shadow resources stay off until the internal route snapshot endpoint,
  # collector image, and a dedicated canary bot have been verified together.
  enabled: false
  publicCutover: false
  gateway:
    image:
      repository: ghcr.io/phenogram/data-plane-gateway
    persistence:
      storageClass: standard
  official:
    image:
      repository: ghcr.io/phenogram/telegram-bot-api
    collector:
      image:
        repository: ghcr.io/phenogram/platform
    fileServer:
      image:
        repository: ghcr.io/phenogram/data-plane-gateway
    pools:
      - name: standard
        localMode: false
        persistence:
          storageClass: standard
          accessModes:
            - ReadWriteOnce
          size: 20Gi
          retain: true
      - name: local
        localMode: true
        persistence:
          storageClass: standard
          accessModes:
            - ReadWriteOnce
          size: 100Gi
          retain: true

networkPolicy:
  ingressController:
    namespace: ingress-nginx
    podLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/name: ingress-nginx
