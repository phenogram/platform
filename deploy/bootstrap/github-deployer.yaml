apiVersion: v1
kind: Namespace
metadata:
  name: phenogram
  labels:
    app.kubernetes.io/part-of: phenogram-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: phenogram
  labels:
    app.kubernetes.io/part-of: phenogram-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: phenogram
  labels:
    app.kubernetes.io/part-of: phenogram-platform
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: phenogram
  labels:
    app.kubernetes.io/part-of: phenogram-platform
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - controllerrevisions
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: phenogram
  labels:
    app.kubernetes.io/part-of: phenogram-platform
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: phenogram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
