worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $proxy_protocol_addr;
  proxy_set_header X-Forwarded-For $proxy_protocol_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  client_max_body_size 1m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:PhenogramEdgeTLS:10m;
  ssl_session_timeout 10m;
  server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name api.phenogram.io;
    ssl_certificate /etc/phenogram-edge/tls/api/tls.crt;
    ssl_certificate_key /etc/phenogram-edge/tls/api/tls.key;
    access_log off;
    error_log /dev/null crit;
    merge_slashes off;
    large_client_header_buffers 4 256k;
    client_header_timeout 500s;
    client_body_timeout 500s;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    location ~* ^/bot.* { proxy_pass http://phenogram-data-plane-gateway.phenogram.svc.cluster.local:8080; }
    location ~* ^/file/bot.* { proxy_pass http://phenogram-data-plane-gateway.phenogram.svc.cluster.local:8080; }
    location / { proxy_pass http://phenogram.phenogram.svc.cluster.local:80; }
  }
  server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name app.phenogram.io;
    ssl_certificate /etc/phenogram-edge/tls/app/tls.crt;
    ssl_certificate_key /etc/phenogram-edge/tls/app/tls.key;
    client_max_body_size 0;
    client_body_timeout 500s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    location / { proxy_pass http://phenogram.phenogram.svc.cluster.local:80; }
  }
  server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name phenogram.io;
    ssl_certificate /etc/phenogram-edge/tls/web/tls.crt;
    ssl_certificate_key /etc/phenogram-edge/tls/web/tls.key;
    location = / { proxy_pass http://phenogram.phenogram.svc.cluster.local:80; }
    location = /privacy { proxy_pass http://phenogram.phenogram.svc.cluster.local:80; }
    location = /assets { proxy_pass http://phenogram.phenogram.svc.cluster.local:80; }
    location /assets/ { proxy_pass http://phenogram.phenogram.svc.cluster.local:80; }
    location / { return 404; }
  }
  server {
    listen 8081;
    access_log off;
    location = /healthz { return 200; }
    location / { return 404; }
  }
}
