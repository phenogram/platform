name: phenogram-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phenogram
      POSTGRES_USER: phenogram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phenogram-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phenogram -d phenogram"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://phenogram:${POSTGRES_PASSWORD:-phenogram-development}@postgres:5432/phenogram
      MASTER_KEY: ${MASTER_KEY:-development-only-master-key-change-me}
      PUBLIC_ID_KEY: ${PUBLIC_ID_KEY:-development-only-public-id-key-change-me}
      LINK_SIGNING_KEY: ${LINK_SIGNING_KEY:-development-only-link-key-change-me}
      TELEGRAM_CLOUD_API_URL: ${TELEGRAM_CLOUD_API_URL:-https://api.telegram.org}
      RUST_LOG: ${RUST_LOG:-phenogram_platform=info,tower_http=info}
    ports:
      - "127.0.0.1:${PHENOGRAM_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      PHENOGRAM_DOMAIN: ${PHENOGRAM_DOMAIN:-localhost}
    ports:
      - "${PHENOGRAM_HTTP_PORT:-80}:80"
      - "${PHENOGRAM_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
