name: Build and deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: phenogram-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/phenogram/platform
  TELEGRAM_IMAGE: ghcr.io/phenogram/telegram-bot-api
  GATEWAY_IMAGE: ghcr.io/phenogram/data-plane-gateway
  RELEASE_NAME: phenogram
  KUBE_NAMESPACE: phenogram
  CONTABO_INGRESS_IP: 84.247.177.201
  LANDING_URL: https://phenogram.io
  APP_URL: https://app.phenogram.io
  MACHINE_API_URL: https://api.phenogram.io

jobs:
  validate:
    name: Validate source and chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup show active-toolchain

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        run: cargo test --all-targets --all-features --locked

      - name: Check the isolated data-plane gateway
        run: |
          cargo fmt --manifest-path deploy/gateway/Cargo.toml --all -- --check
          cargo clippy --manifest-path deploy/gateway/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path deploy/gateway/Cargo.toml --all-targets --locked

      - name: Check browser application syntax
        run: node --check assets/app.js

      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.3

      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/phenogram-platform \
            --values deploy/helm/phenogram-platform/values-production.yaml
          helm template phenogram deploy/helm/phenogram-platform \
            --namespace phenogram \
            --values deploy/helm/phenogram-platform/values-production.yaml \
            --set dataPlane.enabled=false \
            --set dataPlane.publicCutover=false \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string telegramBotApi.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.gateway.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set-string dataPlane.official.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.official.collector.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.official.fileServer.image.digest=sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd \
            --set-string deploymentRevision=validation \
            > /tmp/phenogram-manifests.yaml
          test -s /tmp/phenogram-manifests.yaml
          if grep -q 'DATA_PLANE_SYNC_TOKEN' /tmp/phenogram-manifests.yaml; then
            printf '%s\n' 'Disabled data plane unexpectedly requires its new Secret key.' >&2
            exit 1
          fi
          if grep -Eq 'DATA_PLANE_(GATEWAY(_ADMIN)?|STANDARD_API|LOCAL_API)_URL' /tmp/phenogram-manifests.yaml; then
            printf '%s\n' 'Disabled data plane unexpectedly exposes lifecycle origins.' >&2
            exit 1
          fi

          helm template phenogram deploy/helm/phenogram-platform \
            --namespace phenogram \
            --values deploy/helm/phenogram-platform/values-production.yaml \
            --set dataPlane.enabled=true \
            --set dataPlane.publicCutover=false \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string telegramBotApi.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.gateway.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set-string dataPlane.official.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.official.collector.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.official.fileServer.image.digest=sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd \
            --set-string deploymentRevision=validation \
            > /tmp/phenogram-shadow-manifests.yaml
          test "$(grep -c 'publishNotReadyAddresses: true' /tmp/phenogram-shadow-manifests.yaml)" -ge 4
          test "$(grep -c -- '--update-tap-socket=/run/phenogram-tap/tap.sock' /tmp/phenogram-shadow-manifests.yaml)" -eq 2
          test "$(grep -c 'name: PHENOGRAM_TAP_POOL' /tmp/phenogram-shadow-manifests.yaml)" -eq 2
          grep -q 'value: "standard"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'value: "local"' /tmp/phenogram-shadow-manifests.yaml
          test "$(grep -c -- '^[[:space:]]*- --local$' /tmp/phenogram-shadow-manifests.yaml)" -eq 1
          grep -q 'value: "33554432"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'nginx.ingress.kubernetes.io/enable-access-log: "false"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'nginx.ingress.kubernetes.io/proxy-body-size: "0"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'error_log /dev/null crit;' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'merge_slashes off;' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'large_client_header_buffers 4 256k;' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'client_header_timeout 500s;' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'client_body_timeout 500s;' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'value: "http://phenogram-data-plane-gateway:8080"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'value: "http://phenogram-data-plane-gateway:9090"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'value: "http://phenogram-telegram-standard:8081"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'value: "http://phenogram-telegram-local:8081"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'value: "http://phenogram-telegram-standard:8082"' /tmp/phenogram-shadow-manifests.yaml
          grep -q 'value: "http://phenogram-telegram-local:8082"' /tmp/phenogram-shadow-manifests.yaml
          helm template phenogram deploy/helm/phenogram-platform \
            --namespace phenogram \
            --values deploy/helm/phenogram-platform/values-production.yaml \
            --set dataPlane.enabled=true \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.gateway.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set-string dataPlane.official.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.official.collector.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.official.fileServer.image.digest=sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd \
            --show-only templates/telegram-data-plane-pools.yaml \
            > /tmp/phenogram-pools.yaml
          test "$(grep -c 'runAsGroup: 10001' /tmp/phenogram-pools.yaml)" -eq 6
          test "$(grep -c 'fsGroup: 10001' /tmp/phenogram-pools.yaml)" -eq 2
          test "$(grep -c 'runAsUser: 10002' /tmp/phenogram-pools.yaml)" -eq 2
          test "$(grep -c 'runAsUser: 10001' /tmp/phenogram-pools.yaml)" -eq 2
          test "$(grep -c 'runAsUser: 10003' /tmp/phenogram-pools.yaml)" -eq 2
          test "$(grep -c 'name: FILE_SERVER_MODE' /tmp/phenogram-pools.yaml)" -eq 2
          if helm template phenogram deploy/helm/phenogram-platform \
            --values deploy/helm/phenogram-platform/values-production.yaml \
            --set dataPlane.enabled=true \
            --set-string dataPlane.gateway.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set-string dataPlane.official.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.official.collector.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.official.fileServer.image.digest= \
            > /tmp/phenogram-missing-file-server-digest.yaml \
            2> /tmp/phenogram-missing-file-server-digest.err; then
            printf '%s\n' 'Enabled data plane unexpectedly accepted an unpinned file server.' >&2
            exit 1
          fi
          grep -q 'requires an independently pinned dataPlane.official.fileServer.image.digest' \
            /tmp/phenogram-missing-file-server-digest.err
          if grep -q 'path: /bot' /tmp/phenogram-shadow-manifests.yaml; then
            printf '%s\n' 'Shadow mode unexpectedly moved public Bot API traffic.' >&2
            exit 1
          fi

          helm template phenogram deploy/helm/phenogram-platform \
            --namespace phenogram \
            --values deploy/helm/phenogram-platform/values-production.yaml \
            --set dataPlane.enabled=true \
            --set dataPlane.publicCutover=true \
            --set telegramBotApi.enabled=false \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.gateway.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set-string dataPlane.official.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.official.collector.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.official.fileServer.image.digest=sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd \
            --set-string deploymentRevision=validation \
            > /tmp/phenogram-cutover-manifests.yaml
          grep -Fq 'nginx.ingress.kubernetes.io/use-regex: "true"' /tmp/phenogram-cutover-manifests.yaml
          grep -Fq 'path: /bot.*' /tmp/phenogram-cutover-manifests.yaml
          grep -Fq 'path: /file/bot.*' /tmp/phenogram-cutover-manifests.yaml
          if helm template phenogram deploy/helm/phenogram-platform \
            --values deploy/helm/phenogram-platform/values-production.yaml \
            --set dataPlane.enabled=true \
            --set dataPlane.publicCutover=true \
            --set telegramBotApi.enabled=true \
            --set-string dataPlane.gateway.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set-string dataPlane.official.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string dataPlane.official.collector.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string dataPlane.official.fileServer.image.digest=sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd \
            > /tmp/phenogram-invalid-cutover.yaml 2> /tmp/phenogram-invalid-cutover.err; then
            printf '%s\n' 'Unsafe cutover with the legacy sidecar unexpectedly rendered.' >&2
            exit 1
          fi
          grep -q 'requires telegramBotApi.enabled=false' /tmp/phenogram-invalid-cutover.err

  build:
    name: Build immutable images
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.build_app.outputs.digest }}
      telegram_digest: ${{ steps.build_telegram.outputs.digest }}
      gateway_digest: ${{ steps.build_gateway.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Phenogram
        id: build_app
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=phenogram-app
          cache-to: type=gha,mode=max,scope=phenogram-app

      - name: Build and publish the official local Bot API server
        id: build_telegram
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./deploy/telegram-bot-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.TELEGRAM_IMAGE }}:sha-${{ github.sha }}
            ${{ env.TELEGRAM_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=telegram-bot-api
          cache-to: type=gha,mode=max,scope=telegram-bot-api

      - name: Build and publish the streaming data-plane gateway
        id: build_gateway
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./deploy/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:sha-${{ github.sha }}
            ${{ env.GATEWAY_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=data-plane-gateway
          cache-to: type=gha,mode=max,scope=data-plane-gateway

  deploy:
    name: Deploy with Helm to Contabo
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.phenogram.io
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.3

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.28.15

      - name: Save Kube Config
        env:
          KUBE_CONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_CONTENT"
          mkdir -p "$HOME/.kube"
          umask 077
          printf '%s' "$KUBE_CONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 0600 "$HOME/.kube/config"
          test "$(kubectl config view --minify --raw --output 'jsonpath={.clusters[0].cluster.server}')" = 'https://84.247.177.201:61119'
          test "$(kubectl config view --minify --raw --output 'jsonpath={.clusters[0].cluster.insecure-skip-tls-verify}')" != 'true'
          test "$(kubectl config view --minify --output 'jsonpath={..namespace}')" = "$KUBE_NAMESPACE"
          kubectl auth can-i get deployments --namespace "$KUBE_NAMESPACE"
          if kubectl auth can-i create namespaces >/dev/null 2>&1; then
            printf '%s\n' 'Deployment credential is unexpectedly cluster-scoped.' >&2
            exit 1
          fi

      - name: Reconcile the data-plane control credential
        env:
          DATA_PLANE_SYNC_TOKEN: ${{ secrets.DATA_PLANE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/data-plane-sync-token"
          encoded_file="$RUNNER_TEMP/data-plane-sync-token.b64"
          patch_file="$RUNNER_TEMP/data-plane-sync-token-patch.json"
          trap 'rm -f "$token_file" "$encoded_file" "$patch_file"' EXIT
          umask 077
          printf '%s' "$DATA_PLANE_SYNC_TOKEN" > "$token_file"
          test "$(wc -c < "$token_file" | tr -d ' ')" -ge 32
          base64 < "$token_file" | tr -d '\n' > "$encoded_file"
          jq --rawfile encoded "$encoded_file" -n \
            '{data:{DATA_PLANE_SYNC_TOKEN:$encoded}}' > "$patch_file"
          kubectl --namespace "$KUBE_NAMESPACE" patch secret phenogram-secrets \
            --type=merge --patch-file "$patch_file" >/dev/null

      - name: Deploy the immutable release
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          TELEGRAM_DIGEST: ${{ needs.build.outputs.telegram_digest }}
          GATEWAY_DIGEST: ${{ needs.build.outputs.gateway_digest }}
        run: |
          set -euo pipefail
          case "$APP_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          case "$TELEGRAM_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          case "$GATEWAY_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          for secret_name in phenogram-secrets phenogram-backup-secrets phenogram-ghcr phenogram-io-tls app-phenogram-io-tls api-phenogram-io-tls; do
            kubectl --namespace "$KUBE_NAMESPACE" get secret "$secret_name" >/dev/null
          done
          secret_revision="$(kubectl --namespace "$KUBE_NAMESPACE" get secret phenogram-secrets --output 'jsonpath={.metadata.resourceVersion}')"
          test -n "$secret_revision"
          helm upgrade --install "$RELEASE_NAME" deploy/helm/phenogram-platform \
            --namespace "$KUBE_NAMESPACE" \
            --values deploy/helm/phenogram-platform/values-production.yaml \
            --set-string image.digest="$APP_DIGEST" \
            --set-string telegramBotApi.image.digest="$TELEGRAM_DIGEST" \
            --set-string deploymentRevision="$GITHUB_SHA" \
            --set-string secretRevision="$secret_revision" \
            --atomic \
            --wait \
            --timeout 20m \
            --history-max 10

      - name: Verify Kubernetes rollout
        run: |
          set -euo pipefail
          kubectl --namespace "$KUBE_NAMESPACE" rollout status deployment/phenogram --timeout=5m
          kubectl --namespace "$KUBE_NAMESPACE" rollout status statefulset/phenogram-postgresql --timeout=5m
          if kubectl --namespace "$KUBE_NAMESPACE" get statefulset/phenogram-data-plane-gateway >/dev/null 2>&1; then
            kubectl --namespace "$KUBE_NAMESPACE" rollout status statefulset/phenogram-data-plane-gateway --timeout=10m
            kubectl --namespace "$KUBE_NAMESPACE" rollout status statefulset/phenogram-telegram-standard --timeout=10m
            kubectl --namespace "$KUBE_NAMESPACE" rollout status statefulset/phenogram-telegram-local --timeout=10m
          fi
          kubectl --namespace "$KUBE_NAMESPACE" get pods,service,ingress,pvc

      - name: Verify the Contabo origin
        run: |
          set -euo pipefail
          landing_resolve=(--resolve "phenogram.io:443:$CONTABO_INGRESS_IP")
          app_resolve=(--resolve "app.phenogram.io:443:$CONTABO_INGRESS_IP")
          api_resolve=(--resolve "api.phenogram.io:443:$CONTABO_INGRESS_IP")
          response="$(curl --fail --silent --show-error "${app_resolve[@]}" \
            --retry 18 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 20 \
            "$APP_URL/api/health")"
          jq -e --arg revision "$GITHUB_SHA" \
            '.status == "ok" and .database == true and .deployment_revision == $revision' \
            <<<"$response" >/dev/null

          curl --fail --silent --show-error "${landing_resolve[@]}" \
            --connect-timeout 10 --max-time 20 --output /dev/null "$LANDING_URL/"
          curl --fail --silent --show-error "${landing_resolve[@]}" \
            --connect-timeout 10 --max-time 20 --output /dev/null "$LANDING_URL/privacy"
          test "$(curl --silent --show-error "${landing_resolve[@]}" \
            --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "$LANDING_URL/api/health")" = "404"
          curl --fail --silent --show-error "${app_resolve[@]}" \
            --connect-timeout 10 --max-time 20 --output /dev/null "$APP_URL/"
          test "$(curl --silent --show-error "${api_resolve[@]}" \
            --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "$MACHINE_API_URL/")" = "404"
          test "$(curl --silent --show-error "${api_resolve[@]}" \
            --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "$MACHINE_API_URL/api/health")" = "404"
          test "$(curl --silent --show-error "${api_resolve[@]}" \
            --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "$MACHINE_API_URL/bot0:invalid/getMe")" = "401"

          google_headers="$RUNNER_TEMP/google-oauth-headers"
          github_headers="$RUNNER_TEMP/github-oauth-headers"
          google_redirect="$(curl --silent --show-error "${app_resolve[@]}" \
            --connect-timeout 10 --max-time 20 \
            --dump-header "$google_headers" \
            --output /dev/null --write-out '%{redirect_url}' \
            "$APP_URL/api/auth/oauth/google/start")"
          case "$google_redirect" in https://accounts.google.com/*) ;; *) exit 1 ;; esac
          case "$google_redirect" in *scope=openid%20profile*|*scope=openid+profile*) ;; *) exit 1 ;; esac
          case "$google_redirect" in *email*) exit 1 ;; esac
          case "$google_redirect" in
            *redirect_uri=https%3A%2F%2Fapp.phenogram.io%2Fapi%2Fauth%2Foauth%2Fgoogle%2Fcallback*state=*code_challenge=*code_challenge_method=S256*) ;;
            *) exit 1 ;;
          esac
          grep -Eiq '^set-cookie: phg_oauth=.*HttpOnly.*SameSite=Lax.*Max-Age=600.*Secure' "$google_headers"
          grep -Eiq '^cache-control: no-store' "$google_headers"

          github_redirect="$(curl --silent --show-error "${app_resolve[@]}" \
            --connect-timeout 10 --max-time 20 \
            --dump-header "$github_headers" \
            --output /dev/null --write-out '%{redirect_url}' \
            "$APP_URL/api/auth/oauth/github/start")"
          case "$github_redirect" in https://github.com/login/oauth/authorize*) ;; *) exit 1 ;; esac
          case "$github_redirect" in *scope=*) exit 1 ;; esac
          case "$github_redirect" in
            *redirect_uri=https%3A%2F%2Fapp.phenogram.io%2Fapi%2Fauth%2Foauth%2Fgithub%2Fcallback*state=*code_challenge=*code_challenge_method=S256*) ;;
            *) exit 1 ;;
          esac
          grep -Eiq '^set-cookie: phg_oauth=.*HttpOnly.*SameSite=Lax.*Max-Age=600.*Secure' "$github_headers"
          grep -Eiq '^cache-control: no-store' "$github_headers"
          printf '%s\n' 'Contabo deployment revision and three-host contract verified.'

      - name: Remove temporary deployment credentials
        if: always()
        run: |
          rm -f "$HOME/.kube/config"
