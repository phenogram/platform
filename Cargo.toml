[package]
name = "phenogram-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Telegram Bot API-compatible gateway and operations platform"
license = "AGPL-3.0-or-later"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
base64 = "0.22.1"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.31"
getrandom = "0.3.3"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
mime_guess = "2.0.5"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
socket2 = "0.6.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-gzip", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
